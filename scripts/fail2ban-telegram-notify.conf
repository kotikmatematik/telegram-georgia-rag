# fail2ban custom action: notify via Telegram on every ban.
# Deployed to /etc/fail2ban/action.d/telegram-notify.conf on the server —
# lives here in the repo just so it's tracked/reviewable, not read from this
# path directly by fail2ban.
[Definition]
actionban = /opt/telegram-georgia-rag/scripts/notify_ban.sh <name> <ip> <failures>
actionunban =
