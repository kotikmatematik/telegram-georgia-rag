[project]
name = "telegram-georgia-rag"
version = "0.1.0"
description = "RAG-ассистент по русскоязычным Telegram-чатам о жизни в Грузии"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "chromadb>=0.5",
    "aiogram>=3.10",
    "telethon>=1.36",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.8",
]
